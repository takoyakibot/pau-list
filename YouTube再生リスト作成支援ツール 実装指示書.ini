YouTube再生リスト作成支援ツール 実装指示書
Claude Code 向けのプロジェクト草案。ここまでの調査と方針をまとめたもの。
1. 目的
ログインした本人が、自分のチャンネルの動画を複数回の検索をまたいで選び、チェックした動画をまとめて1つの再生リストにできる小さなWebツールを作る。YouTube Studio でも似たことはできるが、検索のたびに選択が消えるなど不便な点を解消することが狙い。
2. 主な機能
• Googleアカウントでログインし、自分のチャンネルを対象にする。
• 自分のアップロード動画の一覧を取得して表示する。
• 一覧をタイトルなどで絞り込める。絞り込みはアプリ側(クライアント側)で行い、検索を変えてもチェック状態は外れない。
• チェックした動画の総数を常に表示し、選択の解除や全解除ができる。
• 再生リスト名と公開範囲(非公開、限定公開、公開)を指定し、チェック済みの動画をまとめて追加する。
• 作成結果(成功した件数、失敗した動画)を表示し、作成した再生リストへのリンクを出す。
3. YouTube API の仕様と制約
認証
• APIキーだけでは再生リストを作成できない。作成(playlists.insert)と動画の追加(playlistItems.insert)には OAuth 2.0 による認可が必須。
• APIキーは公開データの取得用で、プロジェクトの識別に使われるだけ。チャンネルとは紐づかない。
• 再生リストが作られる先は、OAuthで認可したアカウントのチャンネル。
• 必要なスコープはYouTubeの書き込み系スコープ。実装前に公式ドキュメントで最小のスコープを確認すること。
• Google Cloud でプロジェクトを作成し、YouTube Data API v3 を有効化し、OAuthクライアントIDを作成する。
クオータ
• デフォルトは1プロジェクトあたり1日10,000ユニットで、太平洋時間の深夜0時にリセットされる。
• search.list は1回100ユニットと重いので使わない。
• 自分の動画一覧は、チャンネルの「アップロード」再生リストを playlistItems.list で取得する方式にする。
• 書き込み系(再生リスト作成、動画追加)の1回あたりの消費ユニットは未確認。記憶では50ユニット程度だが、実装前に公式のクオータ計算ページで必ず確認し、この文書に追記すること。
• 一度に大量の動画を追加するとクオータを使い切る恐れがあるため、追加前に概算の消費ユニットを画面に表示し、上限を超える場合は警告する。
4. 設計方針
• 構成は、まずフロントエンドのみのシンプルな構成を優先する。OAuthにはGoogle Identity Servicesを使う。
• チェック状態は、動画IDの集合としてブラウザ内に保持する。検索や絞り込みを変えても保持される。
• チェック状態の保存先(ブラウザのローカル保存のみか、別端末でも引き継ぐか)は未決定。まずはローカル保存で作り、後から拡張できるようにしておく。
• 動画の追加は順番に実行し、途中で失敗しても作成済みの再生リストと成功分は保持し、失敗分だけ再試行できるようにする。
• アクセストークンやクライアントシークレットをリポジトリに含めない。設定は環境変数や設定ファイルで渡す。
5. 画面イメージ
1.  ログイン画面: Googleでログインするボタン。
2.  動画一覧画面: 上部に絞り込み入力欄と選択数の表示、本体にチェックボックス付きの動画カード(サムネイル、タイトル、投稿日)。
3.  作成画面: 再生リスト名、公開範囲、追加予定の件数、概算クオータ、作成ボタン。
4.  結果画面: 成功と失敗の件数、再生リストへのリンク。
6. 実装の進め方
1.  最初に、クオータ計算ページと各メソッドの公式ドキュメントを確認し、必要なスコープと消費ユニットをこの文書に追記する。
2.  Google Cloud 側のセットアップ手順を README にまとめる。
3.  ログインと自分の動画一覧の取得を実装する。
4.  絞り込みとチェック保持を実装する。
5.  再生リストの作成と動画追加を実装し、エラー処理と再試行を入れる。
6.  動作確認として、少数の動画で実際に再生リストが作られることを確かめる。
7. 提案機能(身内からの再生リスト案)
身内の数人がログインなしで再生リストの案を作ってチャンネル主に送り、チャンネル主が承認すると実際の再生リストになる。サーバーは使わず、基本機能が動いてから実装する。
役割と流れ
1.  提案者(ログイン不要): 提案用の画面でチャンネルの公開動画を見てチェックし、再生リスト名とコメントを付けて「提案」を作る。
2.  受け渡し: 提案を1本の文字列にまとめ、共有リンクまたはコピーした文字列でチャンネル主に送る。
3.  チャンネル主(OAuthでログイン): 提案を読み込み、中身を確認し、動画の取捨選択や名前の修正をして、承認すると既存の作成処理で再生リストが作られる。
技術方針
• 提案者側は読み取りだけなので、APIキーのみで動く。動画一覧はアップロード用再生リストを playlistItems.list で取得し、search.list は使わない。
• ブラウザに置いたAPIキーは外から見えるため、Google Cloud側でHTTPリファラ制限と、YouTube Data API のみの制限をかける。
• 提案データは、動画ID(11文字)の配列、リスト名、コメント、提案者名、作成日時のJSONとし、URLのハッシュ部分(# 以降)か貼り付け用の文字列にエンコードする。ハッシュ部分はサーバーに送られない。
• 数十本程度ならURLに収まる見込み。チャットアプリで途中で切れる場合に備え、「文字列をコピー」と「貼り付けて読み込み」の手段も用意する。
• 提案の履歴はどこにも残らない。必要になったら小さなバックエンド(Cloudflare Workers と KV など)を足す。今回は対象外。
注意点
• 届いた提案データは信用しない。読み込み時に動画IDの形式を検証し、本数と文字数に上限を設け、表示では文字列をHTMLとして解釈せずエスケープする。
• チャンネル主の画面では、提案内の動画がチャンネル主自身のアップロード動画かを照合する。含まれない動画は警告を出し、既定では除外する。
• 非公開と限定公開の動画は提案者に見えないため、提案には入らない。
• 提案者の閲覧はAPIキーのクオータを共有する。身内数人なら問題になりにくいが、読み取り1回あたりの消費は公式のクオータ計算ページで確認する。
• 承認時の書き込みは、基本機能の作成処理と同じ仕組みで、同じクオータを使う。
画面
• 提案画面(ログインなし): 動画一覧、選択数、リスト名とコメントの入力欄、「提案を作る」ボタン、リンクと文字列のコピー。
• 承認画面(ログイン必須): 提案の読み込み欄、提案内容の確認と編集、「承認して作成」ボタン。
8. 未決定事項
• チェック状態を別端末でも引き継ぐ必要があるか。
• 公開サービスとして他人にも使わせるか、自分専用か。他人に使わせる場合は、OAuthの同意画面の審査やクオータ増加の申請が必要になる可能性がある。
• 使用するフレームワークや言語の希望。