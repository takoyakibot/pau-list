# PHP テスト（SQLite と MySQL グループ）・Pint・依存の脆弱性監査・フロントエンドビルドの CI。
# MySQL ジョブは mysql グループ（MySQL でしか確かめられない照合順序・行ロック等）だけを流す。
# PHP ジョブはテストが withoutVite() で動くため public/build（Vite ビルド）を必要としない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests (SQLite) / Pint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit composer dependencies
        run: composer audit

      # APP_KEY はワークフローに書かず、実行時に使い捨てのものを生成する
      - name: Generate app key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

  php-mysql:
    name: PHP tests (MySQL group, ${{ matrix.db.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 本番（CORESERVER）は MariaDB 11.4。MySQL 8.4 と両方で同時実行・照合順序のテストを流す
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: MySQL 8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1
          - name: MariaDB 11.4
            image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.db.image }}
        # 空の root パスワードはこのジョブ内のサービス限定（秘密値は使わない）
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: listmaker_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: listmaker_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    # phpunit.xml の <env> は force 無しなので、ここで渡す値が優先される
    # DB 名は _test で終わること（tests/TestCase.php のガード: それ以外の MySQL ではテストを実行せずスキップする）
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: listmaker_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # APP_KEY はワークフローに書かず、実行時に使い捨てのものを生成する
      - name: Generate app key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run MySQL test group
        run: php artisan test --group=mysql

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JS unit tests
        run: npm run test:js

      - name: Build
        run: npm run build

      # 標準 Alpine ビルド（new Function を使う）が混入していないこと
      - name: Verify CSP-safe Alpine build
        shell: bash
        run: |
          shopt -s nullglob
          files=(public/build/assets/*.js)
          test ${#files[@]} -gt 0
          ! grep -q 'new Function' "${files[@]}"
